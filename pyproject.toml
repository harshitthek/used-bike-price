[project]
name = "autovaluate-ai"
version = "2.4.0"
description = "Enterprise vehicle valuation and lifecycle simulation suite"
authors = [
    { name = "Harshit", email = "164781433+harshitthek@users.noreply.github.com" }
]
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "E501"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
