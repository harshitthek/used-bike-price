name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-checks:
    name: 🐍 Backend Lint, Test & Docker
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check code formatting (Black)
      run: |
        black --check src tests

    - name: Lint code (Ruff)
      run: |
        ruff check src tests

    - name: Run Pytest Suite (58 tests)
      run: |
        python -m pytest tests/ --import-mode=importlib

    - name: Build Docker Image
      run: |
        docker build -t used-bike-price-api:latest .

  frontend-checks:
    name: ⚛️ Frontend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install Node dependencies
      run: npm ci

    - name: Run Frontend Tests (Vitest 44 tests)
      run: npm test

    - name: Build Frontend Bundle
      run: npm run build