name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: 🐍 Backend Lint, Test & Docker Cache
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Cache Pytest & Ruff test state
      uses: actions/cache@v4
      with:
        path: |
          .pytest_cache
          .ruff_cache
        key: ${{ runner.os }}-backend-test-cache-${{ hashFiles('src/**', 'tests/**') }}
        restore-keys: |
          ${{ runner.os }}-backend-test-cache-

    - name: Check code formatting (Black)
      run: |
        black --check src tests

    - name: Lint code (Ruff)
      run: |
        ruff check src tests

    - name: Run Pytest Suite (58 tests)
      run: |
        python -m pytest tests/ --import-mode=importlib

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image with GitHub Actions layer cache
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: used-bike-price-api:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  frontend-checks:
    name: ⚛️ Frontend Test, Cache & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install Node dependencies
      run: npm ci

    - name: Cache Vite & Vitest Transformation Cache
      uses: actions/cache@v4
      with:
        path: |
          frontend/node_modules/.vite
          frontend/node_modules/.vitest
        key: ${{ runner.os }}-vite-cache-${{ hashFiles('frontend/package-lock.json', 'frontend/src/**') }}
        restore-keys: |
          ${{ runner.os }}-vite-cache-${{ hashFiles('frontend/package-lock.json') }}
          ${{ runner.os }}-vite-cache-

    - name: Run Frontend Tests (Vitest 44 tests)
      run: npm test

    - name: Build Frontend Bundle
      run: npm run build