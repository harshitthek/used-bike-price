services:
  autovaluate:
    build:
      context: .
      dockerfile: Dockerfile
    image: autovaluate-ai:latest
    container_name: autovaluate_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - VITE_API_KEY=dev_12345
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
