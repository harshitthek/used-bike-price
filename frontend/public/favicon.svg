<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Sharp, high-contrast linear gradients without any raster filters -->
    <linearGradient id="avBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111420" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <linearGradient id="avBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="avBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="avGauge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Clean Obsidian Squircle Background with Crisp Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#avBg)" stroke="url(#avBorder)" stroke-width="2" />

  <!-- Speedometer Valuation Arc (Clean, thick vector stroke) -->
  <path
    d="M 15 45 A 21 21 0 1 1 49 45"
    fill="none"
    stroke="#1e2433"
    stroke-width="5"
    stroke-linecap="round"
  />
  <path
    d="M 15 45 A 21 21 0 1 1 42 16"
    fill="none"
    stroke="url(#avGauge)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Gauge Tick Markers -->
  <circle cx="15" cy="45" r="2.5" fill="#6366f1" />
  <circle cx="49" cy="45" r="2.5" fill="#1e2433" />
  <circle cx="32" cy="11" r="2.5" fill="#06b6d4" />

  <!-- High-Precision AI Lightning / Chevron Emblem -->
  <path
    d="M 35 15 L 21 34 L 31 34 L 28 49 L 44 28 L 33 28 Z"
    fill="url(#avBolt)"
    stroke="#ffffff"
    stroke-width="1.2"
    stroke-linejoin="round"
  />
</svg>