<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Primary Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Background Ambient Glow -->
  <circle cx="32" cy="32" r="18" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <!-- Speedometer / Valuation Arc (75% circular gauge) -->
  <path d="M 18 42 A 18 18 0 1 1 46 42" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <path d="M 18 42 A 18 18 0 1 1 40 18" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />

  <!-- Valuation Metric Nodes -->
  <circle cx="18" cy="42" r="2.5" fill="#6366f1" />
  <circle cx="46" cy="42" r="2.5" fill="#334155" />
  <circle cx="32" cy="14" r="2" fill="#22d3ee" />

  <!-- Central Dynamic AI Chevron / Aerodynamic Needle -->
  <g transform="translate(32, 33)">
    <!-- Speedometer Needle -->
    <line x1="0" y1="0" x2="6" y2="-11" stroke="#22d3ee" stroke-width="2.8" stroke-linecap="round" filter="url(#glow)" />
    
    <!-- Central Pivot Hub -->
    <circle cx="0" cy="0" r="4.5" fill="#0f172a" stroke="url(#borderGrad)" stroke-width="2" />
    <circle cx="0" cy="0" r="2" fill="#38bdf8" />

    <!-- AI Spark Pulse -->
    <path d="M -8 8 L -2 12 L 4 7 L 10 11" fill="none" stroke="url(#brandGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  </g>

  <!-- Top-Right AI Indicator Spark -->
  <path d="M 44 14 L 46 8 L 48 14 L 54 16 L 48 18 L 46 24 L 44 18 L 38 16 Z" fill="#38bdf8" opacity="0.9" transform="scale(0.5) translate(46, 6)" />
</svg>